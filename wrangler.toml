# ============================================================
# Cloudflare Workers —— 纯静态资源（没有 Worker 脚本，只发 out/ 里的文件）
#
# 为什么是 Workers 而不是 Pages：
# 仓库根目录存在 wrangler.toml 时，Cloudflare 的构建系统就按 Workers 处理，
# 部署命令是 `npx wrangler deploy`；Pages 那套「上传 build 输出目录」反而用不上。
# 官方迁移指南也是 pages_build_output_dir → assets.directory。
#
#   npm run build      # next build（output: "export"）→ out/
#   npm run deploy     # npx wrangler deploy（上传 out/）
#   npm run preview    # npx wrangler dev（本地起 Worker 看静态资源）
#
# Dashboard（Build settings）：
#   Build command  = npm run build
#   Deploy command = npx wrangler deploy
# ============================================================

# Worker 名（必须和 Cloudflare 上已有的 Worker 项目名一致）
name = "ysmparser"

# 运行时兼容日期
compatibility_date = "2026-11-05"

# 不覆盖 Dashboard 上配置的变量
keep_vars = true

# 静态资源目录 —— next build 的导出结果
[assets]
directory = "./out"
# Next 导出的是 index.html / 404.html
html_handling = "auto-trailing-slash"
# 找不到的路径回落到 Next 生成的 404.html
not_found_handling = "404-page"

# 环境变量
[vars]
# NEXT_PUBLIC_EXAMPLE = ""
